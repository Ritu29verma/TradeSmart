name: Backend CI/CD

on:
  push:
    paths:
      - 'BE/**'
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-ci-cd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Jest tests
        run: npm run test

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Test Vercel Auth
        run: vercel whoami

      # 🚀 Preview Deployments for PRs
      - name: Deploy Backend Preview (PR)
        if: github.event_name == 'pull_request'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --yes --confirm \
            --scope ritu1298verma-8387 \
            --project ${{ secrets.VERCEL_PROJECT_ID_BE }} 

      # 🚀 Production Deployment only on push to main
      - name: Deploy Backend Production (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --confirm \
            --scope ritu1298verma-8387 \
            --project ${{ secrets.VERCEL_PROJECT_ID_BE }} 
      